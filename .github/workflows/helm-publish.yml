name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'

jobs:
  helm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Get chart metadata
        id: chart
        run: |
          VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          NAME=$(grep '^name:' helm/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "tag=$NAME-$VERSION" >> $GITHUB_OUTPUT

      - name: Package Helm chart
        run: mkdir -p /tmp/charts && helm package helm/ --destination /tmp/charts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.chart.outputs.tag }}
          name: ${{ steps.chart.outputs.tag }}
          files: /tmp/charts/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm repo index
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.chart.outputs.tag }}"
          helm repo index /tmp/charts/ --url "$BASE_URL" --merge docs/index.yaml
          cp /tmp/charts/index.yaml docs/index.yaml

      - name: Enable GitHub Pages (docs/ on main)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"main","path":"/docs"}}' || true
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"main","path":"/docs"}}' || true

      - name: Commit and push index.yaml
        run: |
          git add docs/index.yaml
          git diff --staged --quiet || git commit -m "chore: update Helm repo index for ${{ steps.chart.outputs.tag }} [skip ci]"
          git push
